<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#066bc7" />
    <title>Offline | Trimurti Coolers</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; color: #071f3d; background: #f5f9fc; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      main { display: grid; width: min(100% - 2rem, 760px); min-height: 100vh; margin: auto; place-items: center; text-align: center; }
      p:first-child { color: #066bc7; font-size: .75rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: .5rem 0 1rem; font-size: clamp(2.8rem, 8vw, 5.5rem); letter-spacing: -.06em; line-height: 1; }
      p { color: #40566d; }
      button { border: 1px solid #083f78; border-radius: 4px; padding: .85rem 1.2rem; color: white; background: #083f78; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div>
        <p>Trimurti Coolers</p>
        <h1>You are currently offline.</h1>
        <p>Reconnect to view the latest catalogue and product information.</p>
        <button type="button" onclick="window.location.reload()">Try again</button>
      </div>
    </main>
  </body>
</html>
